services:
  webdav:
    image: bytemark/webdav
    container_name: webdav
    restart: always
    ports:
      - "${WEBDAV_PORT:-80}:80"
    env_file:
      - .env
    environment:
      AUTH_TYPE: Digest
      USERNAME: ${USER}
      PASSWORD: ${PASSWORD}
    volumes:
      - ${WEBDAV_DATA_DIR:-./data}:/var/lib/dav
    networks:
      - cloudflare_tunnelnet

networks:
  cloudflare_tunnelnet:
    external: true
