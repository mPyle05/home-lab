services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/New_York}
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - ./config:/config
      - ${MEDIA_DIR:-/data}:/data
    devices:
      - /dev/dri:/dev/dri # Hardware transcoding (Intel/AMD GPU)
    ports:
      - 8096:8096
      - 7359:7359/udp
      - 1900:1900/udp
